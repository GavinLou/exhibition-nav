<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>觸控測試</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f0f0f0;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }
    h1 {
      color: #C9A876;
      text-align: center;
    }
    .counter {
      font-size: 48px;
      text-align: center;
      margin: 20px 0;
      color: #333;
    }
    button {
      width: 100%;
      padding: 20px;
      margin: 10px 0;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      transition: transform 0.1s;
    }
    button:active {
      transform: scale(0.95);
    }
    .btn-click {
      background: #C9A876;
    }
    .btn-touch {
      background: #4CAF50;
    }
    .btn-both {
      background: #2196F3;
    }
    .log {
      margin-top: 20px;
      padding: 10px;
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 5px;
      max-height: 200px;
      overflow-y: auto;
    }
    .log-item {
      padding: 5px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>純 HTML 觸控測試</h1>

    <div class="counter">
      <div>點擊: <span id="clickCount">0</span></div>
      <div>觸控: <span id="touchCount">0</span></div>
    </div>

    <button class="btn-click" id="btnClick">測試 onClick</button>
    <button class="btn-touch" id="btnTouch">測試 onTouch</button>
    <button class="btn-both" id="btnBoth">測試兩者</button>

    <button onclick="clearLog()" style="background: #f44336;">清除日誌</button>

    <div class="log" id="log"></div>
  </div>

  <script>
    let clickCount = 0;
    let touchCount = 0;

    function updateDisplay() {
      document.getElementById('clickCount').textContent = clickCount;
      document.getElementById('touchCount').textContent = touchCount;
    }

    function addLog(message) {
      const log = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      const item = document.createElement('div');
      item.className = 'log-item';
      item.textContent = `[${time}] ${message}`;
      log.insertBefore(item, log.firstChild);
    }

    function clearLog() {
      document.getElementById('log').innerHTML = '';
      addLog('日誌已清除');
    }

    // 測試 onClick
    document.getElementById('btnClick').addEventListener('click', function() {
      clickCount++;
      updateDisplay();
      addLog('Click 事件觸發！總計: ' + clickCount);
    });

    // 測試 onTouch
    const btnTouch = document.getElementById('btnTouch');
    btnTouch.addEventListener('touchstart', function(e) {
      addLog('Touch Start');
    });
    btnTouch.addEventListener('touchend', function(e) {
      e.preventDefault();
      touchCount++;
      updateDisplay();
      addLog('Touch End 事件觸發！總計: ' + touchCount);
    });

    // 測試兩者
    const btnBoth = document.getElementById('btnBoth');
    btnBoth.addEventListener('click', function() {
      clickCount++;
      updateDisplay();
      addLog('Both - Click 事件');
    });
    btnBoth.addEventListener('touchend', function(e) {
      e.preventDefault();
      touchCount++;
      updateDisplay();
      addLog('Both - Touch 事件');
    });

    addLog('頁面載入完成');
    addLog('User Agent: ' + navigator.userAgent.substring(0, 50) + '...');
  </script>
</body>
</html>

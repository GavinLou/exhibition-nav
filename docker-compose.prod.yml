# docker-compose.prod.yml - 正式版配置
# 与开发版的唯一区别：不挂载代码（不支持热更新），使用生产构建

services:
  # =========================================================
  # 1. PostGIS 資料庫
  # =========================================================
  db:
    image: pgrouting/pgrouting:15-3.5-3.7
    container_name: bmc_gis_db

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${DB_PORT:-5432}:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init-scripts:/docker-entrypoint-initdb.d
      - ./database/maintenance:/docker-entrypoint-initdb.d/maintenance

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: always

    networks:
      - bmc_network

  # =========================================================
  # 2. FastAPI 後端 - 生產模式（無熱更新）
  # =========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: bmc_backend_api

    ports:
      - "${BACKEND_PORT:-8000}:8000"

    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - OPENAI_API_KEY=${OPENAI_API_KEY}

    depends_on:
      db:
        condition: service_healthy

    restart: always

    networks:
      - bmc_network

  # =========================================================
  # 3. Next.js 前端 - 生產模式（預構建，無熱更新）
  # =========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod

    container_name: bmc_nextjs_frontend_prod

    ports:
      - "${FRONTEND_PORT:-3000}:3000"

    volumes:
      # 持久化用戶上傳的文件（CRUD 操作上傳的媒體文件）
      - frontend-uploads:/app/public/uploads

    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}

    depends_on:
      - backend

    restart: always

    networks:
      - bmc_network

  # =========================================================
  # 4. pgAdmin
  # =========================================================
  pgadmin:
    image: dpage/pgadmin4:8.14

    container_name: bmc_pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "True"

    ports:
      - "${PGADMIN_PORT:-5050}:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # 自動連接資料庫的設定檔
      - ./database/pgadmin/servers.json:/pgadmin4/servers.json:ro
      # 密碼檔案，讓 pgAdmin 自動登入資料庫
      - ./database/pgadmin/pgpass:/pgpass:ro

    depends_on:
      db:
        condition: service_healthy

    restart: always

    networks:
      - bmc_network

# =========================================================
# volumes
# =========================================================
volumes:
  pgdata:
  pgadmin_data:
  frontend-uploads:  # 前端用戶上傳的文件（audio/images/videos）

# =========================================================
# networks
# =========================================================
networks:
  bmc_network:
    driver: bridge
